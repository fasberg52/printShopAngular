<div class="admin-layout">
  <aside class="admin-sidebar">
    <h2 class="sidebar-title">پنل ادمین</h2>
    <nav class="sidebar-nav">
      <a
        routerLink="/admin/dashboard"
        routerLinkActive="nav-link-active"
        class="nav-link"
      >
        <i class="pi pi-home nav-icon"></i>
        داشبورد
      </a>
      <a
        routerLink="/admin/price-rules"
        routerLinkActive="nav-link-active"
        class="nav-link"
      >
        <i class="pi pi-dollar nav-icon"></i>
        قوانین قیمت
      </a>
      <a
        routerLink="/admin/delivery-methods"
        routerLinkActive="nav-link-active"
        class="nav-link"
      >
        <i class="pi pi-truck nav-icon"></i>
        روش‌های ارسال
      </a>
    </nav>
    <button type="button" class="nav-link" aria-label="خروج" (click)="logout()">
      <i class="pi pi-sign-out nav-icon"></i>
      خروج
    </button>
  </aside>

  <main class="admin-main">
    <header class="admin-header">
      <h1 class="header-title">به پنل ادمین خوش آمدید</h1>
      <p-button
        label="خروج"
        icon="pi pi-sign-out"
        styleClass="p-button-danger p-button-sm"
        (click)="logout()"
      ></p-button>
    </header>

    <div class="admin-content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
