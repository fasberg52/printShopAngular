<div class="admin-layout flex h-screen">
  <aside class="w-64 bg-gray-800 text-white p-4 shadow-lg">
    <h2 class="text-2xl font-bold mb-6">پنل ادمین</h2>
    <nav class="space-y-1">
      <a
        routerLink="/admin/dashboard"
        routerLinkActive="bg-gray-700"
        class="block py-2 px-4 rounded hover:bg-gray-700 transition-colors"
      >
        <i class="pi pi-home mr-2"></i>
        داشبورد
      </a>
      <a
        routerLink="/admin/price-rules"
        routerLinkActive="bg-gray-700"
        class="block py-2 px-4 rounded hover:bg-gray-700 transition-colors"
      >
        <i class="pi pi-dollar mr-2"></i>
        قوانین قیمت
      </a>
    </nav>
  </aside>

  <main class="flex-1 flex flex-col overflow-hidden">
    <header class="bg-white shadow p-4 flex justify-between items-center">
      <h1 class="text-xl font-semibold">به پنل ادمین خوش آمدید</h1>
      <p-button
        label="خروج"
        icon="pi pi-sign-out"
        styleClass="p-button-danger p-button-sm"
        (click)="logout()"
      ></p-button>
    </header>

    <div class="flex-1 overflow-y-auto p-6 bg-gray-50">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
