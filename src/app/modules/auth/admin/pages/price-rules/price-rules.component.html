<div class="price-rules-container">
  <p-confirmDialog></p-confirmDialog>
  <p-toast></p-toast>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-left">
      <h2 class="title">قوانین قیمت</h2>
    </div>
    <div class="toolbar-right">
      <p-button
        label="افزودن قانون جدید"
        icon="pi pi-plus"
        (click)="openCreateModal()"
        styleClass="p-button-primary"
      ></p-button>
    </div>
  </div>

  <!-- Table -->
  <p-table
    [value]="priceRules()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="20"
    [rowsPerPageOptions]="[10, 20, 50]"
    [tableStyle]="{ 'min-width': '50rem' }"
    [globalFilterFields]="['name', 'productType']"
    styleClass="p-datatable-striped"
    dataKey="_id"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="name">
          نام <p-sortIcon field="name"></p-sortIcon>
        </th>
        <th pSortableColumn="productType">
          نوع محصول <p-sortIcon field="productType"></p-sortIcon>
        </th>
        <th pSortableColumn="price">
          قیمت <p-sortIcon field="price"></p-sortIcon>
        </th>
        <th>تاریخ ایجاد</th>
        <th>وضعیت</th>
        <th style="width: 100px">عملیات</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-priceRule>
      <tr>
        <td>{{ priceRule.name }}</td>
        <td>
          <p-tag
            [value]="getProductTypeLabel(priceRule.productType)"
            [severity]="priceRule.productType === 'print' ? 'success' : 'info'"
          ></p-tag>
        </td>
        <td class="price-cell">{{ formatPrice(priceRule.price) }} تومان</td>
        <td>{{ formatDate(priceRule.createdAt) }}</td>
        <td>
          <p-tag
            [value]="priceRule.isActive ? 'فعال' : 'غیرفعال'"
            [severity]="priceRule.isActive ? 'success' : 'danger'"
          ></p-tag>
        </td>
        <td>
          <div class="actions">
            <p-button
              icon="pi pi-ellipsis-v"
              [text]="true"
              [rounded]="true"
              styleClass="action-button"
              (click)="menu.toggle($event)"
            ></p-button>

            <p-menu
              #menu
              [model]="getMenuItems(priceRule)"
              [popup]="true"
              [appendTo]="'body'"
              styleClass="price-rule-menu"
            ></p-menu>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <!-- Create/Edit Modal -->
  @if (showCreateModal() || showEditModal()) {
  <app-price-rule-modal
    [priceRule]="selectedPriceRule()"
    [isEditMode]="showEditModal()"
    (close)="onModalClose()"
  />
  }

  <!-- Detail Modal -->
  @if (showDetailModal()) {
  <app-price-rule-detail-modal
    [priceRule]="selectedPriceRule()!"
    (close)="onModalClose()"
    (edit)="openEditModal(selectedPriceRule()!)"
    (delete)="deletePriceRule(selectedPriceRule()!)"
  />
  }
</div>
